<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>這真的只是樂團番嗎？ MyGO!!!!! × Ave Mujica 名場面對決</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
                <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
        
        
    <style>
        /* ============================
           1. Reset & 基本設定
           ============================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============================
           2. CSS 變數
           ============================ */
        :root {
            /* ==== MyGO (right side) palette ==== */
            --mygo-primary: #0a1628;            /* deep ocean blue */
            --mygo-secondary: #2563eb;          /* mist blue */
            --mygo-accent: #06b6d4;            /* cool teal */
            --mygo-soft-cyan: #a0e7e5;         /* soft cyan */
            --mygo-washed-white: #f1f7f9;      /* washed white */
            --mygo-glow: rgba(38, 163, 224, 0.6);
            --mygo-bg: linear-gradient(135deg, var(--mygo-primary) 0%, var(--mygo-secondary) 45%, var(--mygo-soft-cyan) 85%, var(--mygo-washed-white) 100%);

            /* ==== Ave Mujica (left side) palette ==== */
            --ave-primary: #1a0a2e;            /* midnight purple */
            --ave-secondary: #7b2d8e;          /* dark wine red */
            --ave-accent: #d4af37;             /* antique gold */
            --ave-deep-black: #0a0a0f;         /* deep black */
            --ave-ivory: #f5f5f0;              /* ivory white */
            --ave-glow: rgba(123, 45, 142, 0.6);
            --ave-bg: linear-gradient(135deg, var(--ave-deep-black) 0%, var(--ave-primary) 45%, var(--ave-secondary) 85%, var(--ave-ivory) 100%);

            /* ==== Shared ==== */
            --bg-dark: var(--ave-deep-black);
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-dim: #94a3b8;
        }

        /* -------- Decorative background layers -------- */
        .split-left {
            position: relative;
            overflow: hidden;
        }
        .split-left::before {
            content: '';
            position: absolute;
            inset: 20% auto auto 20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at center, var(--ave-accent) 0%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 80px var(--ave-accent), 0 0 120px var(--ave-accent);
            opacity: 0.2;
            mix-blend-mode: screen;
        }
        .split-left::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 60%, rgba(0,0,0,0.7));
        }
        .split-right {
            position: relative;
            overflow: hidden;
        }
        .split-right::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-radial-gradient(circle at 50% 50%, var(--mygo-soft-cyan) 0%, var(--mygo-soft-cyan) 2px, transparent 2px, transparent 4px) ;
            opacity: 0.15;
            animation: ripple 8s linear infinite;
            mix-blend-mode: screen;
        }
        .split-right::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to left, transparent 60%, rgba(0,0,0,0.7));
        }
        @keyframes ripple {
            0% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-2%, -2%) scale(1.05); }
            100% { transform: translate(0,0) scale(1); }
        }

        /* ============================
           3. 畫面管理
           ============================ */
        .screen {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.5s ease-out;
        }

        /* ============================
           4. 開始畫面
           ============================ */
        #start-screen {
            overflow: hidden;
        }

        .split-bg {
            position: absolute;
            inset: 0;
            display: flex;
        }

        .split-left {
            flex: 1;
            /* Gothic opera house gradient */
            background: linear-gradient(135deg, #120318, #2b0b3a, #4a0e2e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .split-left::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 60%, rgba(0,0,0,0.7));
        }

        .split-right {
            flex: 1;
            background: var(--mygo-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .split-right::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to left, transparent 60%, rgba(0,0,0,0.7));
        }

        .split-label {
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            z-index: 1;
            text-shadow: 0 0 30px currentColor;
        }

        .split-left .split-label {
            color: var(--ave-accent);
            animation: breathe 3s ease-in-out infinite;
        }

        .split-right .split-label {
            color: var(--mygo-accent);
            animation: breathe 3s ease-in-out infinite 1.5s;
        }

        .start-overlay {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: clamp(2rem, 5vw, 4rem);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 520px;
            width: 90%;
        }

        .start-overlay h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            margin-bottom: 0.3em;
            background: linear-gradient(135deg, var(--ave-accent), #ffffff, var(--mygo-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-overlay .subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            color: var(--text-dim);
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
        }

        .mode-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 0.9rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: inherit;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
        }

        .mode-btn:hover {
            transform: translateY(-3px);
            border-color: var(--ave-accent);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25);
            background: rgba(255, 255, 255, 0.1);
        }

        .mode-btn:active {
            transform: translateY(0);
        }

        /* ============================
           5. 對決畫面
           ============================ */
        #battle-screen {
            padding: 1rem;
            gap: 0.8rem;
            position: relative;
            overflow: hidden;
            /* 雙色漸層底色：左紫右藍 */
            background:
                linear-gradient(to right,
                    #120318 0%, #2b0b3a 25%,
                    #1a0a2e 40%,
                    #0a1628 60%,
                    #0a2540 75%, #0e4b68 100%);
        }

        /* Ave Mujica 側 — 哥德柱狀光影 */
        #battle-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                /* 金色環形光暈（左側） */
                radial-gradient(ellipse 40% 60% at 15% 50%,
                    rgba(212,175,55,0.12) 0%, transparent 70%),
                /* 紫色聚光燈 */
                radial-gradient(ellipse 50% 80% at 20% 30%,
                    rgba(123,45,142,0.15) 0%, transparent 60%),
                /* 右側青色水面反射 */
                radial-gradient(ellipse 40% 70% at 85% 60%,
                    rgba(100,181,246,0.10) 0%, transparent 60%),
                /* 右側 teal 光暈 */
                radial-gradient(ellipse 50% 50% at 80% 40%,
                    rgba(6,182,212,0.08) 0%, transparent 70%),
                /* 中央碰撞能量線 */
                radial-gradient(ellipse 8% 120% at 50% 50%,
                    rgba(212,175,55,0.08) 0%,
                    rgba(100,181,246,0.06) 40%,
                    transparent 80%);
            pointer-events: none;
            z-index: 0;
            animation: battleBgBreathe 8s ease-in-out infinite;
        }

        /* 斜向雨絲紋理（右半側） */
        #battle-screen::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 55%;
            height: 100%;
            background: repeating-linear-gradient(
                -65deg,
                rgba(100,181,246,0.04) 0px,
                rgba(100,181,246,0.04) 1px,
                transparent 1px,
                transparent 6px
            );
            pointer-events: none;
            z-index: 0;
            animation: rainDrift 12s linear infinite;
        }

        @keyframes battleBgBreathe {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @keyframes rainDrift {
            0% { transform: translateY(-5%) translateX(0); }
            100% { transform: translateY(5%) translateX(-2%); }
        }

        /* 對決畫面的中央碰撞光柱 */
        .battle-collision {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 100%;
            background:
                linear-gradient(180deg,
                    transparent 0%,
                    rgba(212,175,55,0.06) 20%,
                    rgba(160,100,220,0.10) 40%,
                    rgba(100,181,246,0.10) 60%,
                    rgba(6,182,212,0.06) 80%,
                    transparent 100%);
            filter: blur(30px);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 0;
            animation: collisionPulse 5s ease-in-out infinite;
        }

        @keyframes collisionPulse {
            0%, 100% { opacity: 0.5; width: 120px; }
            50% { opacity: 0.85; width: 180px; }
        }

        /* 左側暗角（歌劇院幕簾感） */
        .battle-vignette-left {
            position: absolute;
            top: 0; left: 0;
            width: 50%;
            height: 100%;
            background:
                linear-gradient(to right, rgba(18,3,24,0.4) 0%, transparent 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* 右側暗角（雨後校園感） */
        .battle-vignette-right {
            position: absolute;
            top: 0; right: 0;
            width: 50%;
            height: 100%;
            background:
                linear-gradient(to left, rgba(5,19,30,0.4) 0%, transparent 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* 進度條 */
        .progress-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: relative;
            z-index: 2;
        }

        .progress-bar-wrap {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--ave-secondary), var(--mygo-secondary));
            transition: width 0.4s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 0.95rem;
            color: var(--text-dim);
            white-space: nowrap;
            min-width: 100px;
            text-align: right;
        }

        /* 對戰區域 */
        .battle-arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(0.5rem, 2vw, 2rem);
            flex: 1;
            width: 100%;
            max-width: 1100px;
            padding: 0.5rem;
            position: relative;
            z-index: 2;
        }

        /* 卡牌 */
        .battle-card {
            flex: 1;
            max-width: 480px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 3px solid transparent;
            transition: all 0.35s ease;
            background: rgba(10, 10, 20, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .battle-card .card-image-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #111;
        }

        .battle-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .battle-card .card-label {
            text-align: center;
            padding: 0.7rem 1rem;
            font-weight: 700;
            font-size: clamp(0.85rem, 2vw, 1.05rem);
            letter-spacing: 0.08em;
        }

        /* Ave Mujica 卡牌 */
        .battle-card.ave {
            border-color: rgba(123, 45, 142, 0.4);
        }

        .battle-card.ave .card-label {
            background: linear-gradient(135deg, var(--ave-primary), #2d1b4e);
            color: var(--ave-accent);
        }

        .battle-card.ave:hover {
            border-color: var(--ave-secondary);
            box-shadow: 0 0 30px var(--ave-glow), 0 8px 32px rgba(0,0,0,0.5);
            transform: translateY(-6px);
        }

        .battle-card.ave:hover img {
            transform: scale(1.05);
        }

        /* MyGO 卡牌 */
        .battle-card.mygo {
            border-color: rgba(37, 99, 235, 0.4);
        }

        .battle-card.ave .card-label {
            background: linear-gradient(135deg, var(--ave-primary), #2d1b4e);
            color: var(--ave-accent);
            font-family: 'Cinzel', serif;
        }

        .battle-card.mygo .card-label {
            background: linear-gradient(135deg, var(--mygo-primary), #1e3a5f);
            color: var(--mygo-accent);
            font-family: 'Great Vibes', cursive;
        }

        /* Grain overlay — 35mm 膠捲噪點 */
        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            background-size: 180px 180px;
        }

        /* 首頁中心碰撞層 */
        .center-collision {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background:
                radial-gradient(ellipse 10% 100% at 50% 50%,
                    rgba(212,175,55,0.15) 0%,
                    rgba(160,100,220,0.08) 40%,
                    transparent 70%);
            mix-blend-mode: screen;
            animation: centerCollisionPulse 6s ease-in-out infinite;
        }

        @keyframes centerCollisionPulse {
            0%, 100% { opacity: 0.4; filter: blur(30px); }
            50% { opacity: 0.7; filter: blur(50px); }
        }


        .battle-card.mygo:hover {
            border-color: var(--mygo-secondary);
            box-shadow: 0 0 30px var(--mygo-glow), 0 8px 32px rgba(0,0,0,0.5);
            transform: translateY(-6px);
        }

        .battle-card.mygo:hover img {
            transform: scale(1.05);
        }

        /* 選中 / 落選動畫 */
        .battle-card.selected {
            transform: scale(1.04) !important;
            z-index: 2;
        }

        .battle-card.selected.ave {
            border-color: var(--ave-accent) !important;
            box-shadow: 0 0 50px var(--ave-glow), 0 0 80px rgba(212, 175, 55, 0.3) !important;
        }

        .battle-card.selected.mygo {
            border-color: var(--mygo-accent) !important;
            box-shadow: 0 0 50px var(--mygo-glow), 0 0 80px rgba(6, 182, 212, 0.3) !important;
        }

        .battle-card.rejected {
            opacity: 0.3;
            transform: scale(0.95) !important;
            filter: grayscale(0.8);
        }

        /* VS 徽章 */
        .vs-badge {
            width: clamp(45px, 7vw, 70px);
            height: clamp(45px, 7vw, 70px);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ave-secondary), var(--mygo-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.9rem, 2.5vw, 1.4rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            flex-shrink: 0;
            box-shadow: 0 0 25px rgba(123, 45, 142, 0.4), 0 0 25px rgba(37, 99, 235, 0.4);
            animation: vsPulse 2s ease-in-out infinite;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 3;
        }

        /* 即時比分 */
        .live-score {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--text-dim);
            padding: 0.5rem 0;
            position: relative;
            z-index: 2;
        }

        .live-score .score-side {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .live-score .score-side.ave .score-name { color: var(--ave-accent); }
        .live-score .score-side.mygo .score-name { color: var(--mygo-accent); }
        .live-score .score-num {
            font-weight: 900;
            font-size: 1.3em;
            color: #fff;
        }

        .live-score .score-divider {
            font-size: 1.2em;
            color: rgba(255,255,255,0.2);
        }

        /* ============================
           6. 結果畫面
           ============================ */
        #result-screen {
            padding: 2rem;
            gap: 1.5rem;
            text-align: center;
            transition: background 0.5s ease;
        }

        #result-screen.ave-wins {
            background: linear-gradient(180deg, #1a0a2e 0%, #0a0a0f 100%);
        }

        #result-screen.mygo-wins {
            background: linear-gradient(180deg, #0a1628 0%, #0a0a0f 100%);
        }

        #result-screen.tie {
            background: linear-gradient(180deg, #1a0a2e 0%, #0a1628 50%, #0a0a0f 100%);
        }

        .result-title {
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-weight: 500;
            margin-bottom: 0.2rem;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .diagnosis-title {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, var(--ave-accent), #ffffff, var(--mygo-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.6s ease-out 0.2s both;
            text-shadow: none;
        }

        .result-scores {
            display: flex;
            gap: 2rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1rem 0;
        }

        .result-score-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 1.5rem 2.5rem;
            min-width: 180px;
            transition: all 0.3s ease;
        }

        .result-score-card.ave {
            border-color: rgba(123, 45, 142, 0.5);
        }

        .result-score-card.mygo {
            border-color: rgba(37, 99, 235, 0.5);
        }

        .result-score-card.winner {
            transform: scale(1.08);
        }

        .result-score-card.winner.ave {
            border-color: var(--ave-accent);
            box-shadow: 0 0 40px var(--ave-glow);
        }

        .result-score-card.winner.mygo {
            border-color: var(--mygo-accent);
            box-shadow: 0 0 40px var(--mygo-glow);
        }

        .result-score-label {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 0.08em;
        }

        .result-score-card.ave .result-score-label { color: var(--ave-accent); }
        .result-score-card.mygo .result-score-label { color: var(--mygo-accent); }

        .result-score-number {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
        }

        /* 分數對比條 */
        .score-bars {
            width: 100%;
            max-width: 500px;
            display: flex;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
        }

        .score-bar-fill {
            height: 100%;
            transition: width 1s ease-out;
        }

        .score-bar-fill.ave {
            background: linear-gradient(90deg, var(--ave-secondary), var(--ave-accent));
        }

        .score-bar-fill.mygo {
            background: linear-gradient(90deg, var(--mygo-secondary), var(--mygo-accent));
        }

        /* 判定文字 */
        .verdict {
            font-size: clamp(1.05rem, 2.8vw, 1.35rem);
            line-height: 2.2;
            max-width: 520px;
            padding: 2rem 2.5rem;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: fadeInUp 0.8s ease-out 0.5s both;
            text-align: center;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.03em;
        }

        /* 再來一次按鈕 */
        .restart-btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: inherit;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 8px 30px rgba(255,255,255,0.1);
        }

        /* ============================
           7. 動畫
           ============================ */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; text-shadow: 0 0 20px currentColor; }
            50% { opacity: 1; text-shadow: 0 0 40px currentColor, 0 0 60px currentColor; }
        }

        @keyframes vsPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(123,45,142,0.3), 0 0 20px rgba(37,99,235,0.3); }
            50% { transform: scale(1.1); box-shadow: 0 0 35px rgba(123,45,142,0.5), 0 0 35px rgba(37,99,235,0.5); }
        }

        @keyframes cardEnterLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes cardEnterRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .card-enter-left {
            animation: cardEnterLeft 0.4s ease-out;
        }

        .card-enter-right {
            animation: cardEnterRight 0.4s ease-out;
        }

        /* ============================
           8. 響應式設計
           ============================ */
        @media (max-width: 768px) {
            .battle-arena {
                flex-direction: column;
                gap: 0.5rem;
            }

            .battle-card {
                max-width: 95%;
                width: 100%;
            }

            .battle-card .card-image-wrap {
                aspect-ratio: 16 / 9;
            }

            .vs-badge {
                width: 40px;
                height: 40px;
                font-size: 0.85rem;
            }

            .split-label {
                font-size: 1.3rem;
            }

            .result-scores {
                gap: 1rem;
            }

            .result-score-card {
                padding: 1rem 1.8rem;
                min-width: 140px;
            }
        }

        @media (max-width: 480px) {
            .start-overlay {
                padding: 1.5rem;
                border-radius: 16px;
            }

            .mode-btn {
                min-width: 130px;
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
            }
        }

        /* 圖片載入失敗的佔位 */
        .img-error {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.03);
            color: var(--text-dim);
            font-size: 0.85rem;
        }
    </style>

            isAnimating: false
        };

        // ── 工具函式 ──
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ── 畫面切換 ──
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            $(screenId).classList.add('active');
        }

        function startGame(totalScenes) {
            const perSide = totalScenes / 2;  // 每邊各抽幾張

            // 從圖片池中隨機抽取
            const aveSelected = shuffle(AVE_MUJICA_IMAGES).slice(0, perSide).map(f => AVE_MUJICA_PATH + f);

            game.totalRounds = perSide;
            game.currentRound = 0;
            game.aveScore = 0;
            game.mygoScore = 0;
            game.isAnimating = false;
            game.pairs = aveSelected.map((ave, i) => ({ ave, mygo: mygoSelected[i] }));

            $('live-ave').textContent = '0';
            $('live-mygo').textContent = '0';

            showScreen('battle-screen');
            showBattle();
        }

            const cardMygo = $('card-mygo');
            const imgAve = $('img-ave');
            const imgMygo = $('img-mygo');

            // 清除上一輪的狀態
            cardAve.classList.remove('selected', 'rejected');
            cardMygo.classList.remove('selected', 'rejected');

            // 載入圖片
            imgAve.src = pair.ave;
            imgMygo.src = pair.mygo;

            // 圖片載入失敗處理
            imgAve.onerror = function () {
                this.style.display = 'none';
                const wrap = this.parentElement;
                if (!wrap.querySelector('.img-error')) {
                    const div = document.createElement('div');
                    div.className = 'img-error';
                    div.textContent = '圖片載入失敗';
                    wrap.appendChild(div);
                }
            };
            imgAve.onload = function () {
                this.style.display = 'block';
                const err = this.parentElement.querySelector('.img-error');
                if (err) err.remove();
            };
            imgMygo.onerror = function () {
                this.style.display = 'none';
                const wrap = this.parentElement;
                if (!wrap.querySelector('.img-error')) {
                    const div = document.createElement('div');
                    div.className = 'img-error';
                    div.textContent = '圖片載入失敗';
                    wrap.appendChild(div);
                }
            };
            imgMygo.onload = function () {
                this.style.display = 'block';
                const err = this.parentElement.querySelector('.img-error');
                if (err) err.remove();
            };

            // 進場動畫
            cardAve.classList.add('card-enter-left');
            cardMygo.classList.add('card-enter-right');
            setTimeout(() => {
                cardAve.classList.remove('card-enter-left');
                cardMygo.classList.remove('card-enter-right');
            }, 400);

            // 更新進度
            const progress = ((game.currentRound) / game.totalRounds) * 100;
            $('progress-fill').style.width = progress + '%';
            $('progress-text').textContent = `第 ${game.currentRound + 1} / ${game.totalRounds} 場`;

            // 預載下一組圖片
            if (game.currentRound + 1 < game.totalRounds) {
                const next = game.pairs[game.currentRound + 1];
                new Image().src = next.ave;
                new Image().src = next.mygo;
            }

            game.isAnimating = false;
        }

        // ── 選擇卡牌 ──
        function selectCard(side) {
            if (game.isAnimating) return;
            game.isAnimating = true;

            const cardAve = $('card-ave');
            const cardMygo = $('card-mygo');

            // 更新分數
            if (side === 'ave') {
                game.aveScore++;
                cardAve.classList.add('selected');
                cardMygo.classList.add('rejected');
            } else {
                game.mygoScore++;
                cardMygo.classList.add('selected');
                cardAve.classList.add('rejected');
            }

            // 更新即時比分
            $('live-ave').textContent = game.aveScore;
            $('live-mygo').textContent = game.mygoScore;

            game.currentRound++;

            // 延遲後進入下一場或結果
            setTimeout(() => {
                if (game.currentRound >= game.totalRounds) {
                    showResults();
                } else {
                    showBattle();
                }
            }, 650);
        }

        // ── 顯示結果 ──
        function showResults() {
            const resultScreen = $('result-screen');

            // 設定背景主題
            resultScreen.classList.remove('ave-wins', 'mygo-wins', 'tie');
            if (game.aveScore > game.mygoScore) {
                resultScreen.classList.add('ave-wins');
            } else if (game.mygoScore > game.aveScore) {
                resultScreen.classList.add('mygo-wins');
            } else {
                resultScreen.classList.add('tie');
            }

            showScreen('result-screen');

            // 動畫計數
            animateCount('result-ave', game.aveScore);
            animateCount('result-mygo', game.mygoScore);

            // 勝者卡牌高亮
            const cardAve = $('result-card-ave');
            const cardMygo = $('result-card-mygo');
            cardAve.classList.remove('winner');
            cardMygo.classList.remove('winner');

            if (game.aveScore > game.mygoScore) {
                cardAve.classList.add('winner');
            } else if (game.mygoScore > game.aveScore) {
                cardMygo.classList.add('winner');
            } else {
                cardAve.classList.add('winner');
                cardMygo.classList.add('winner');
            }

            // 分數對比條
            const total = game.aveScore + game.mygoScore;
            const avePct = total > 0 ? (game.aveScore / total * 100) : 50;
            const mygoPct = total > 0 ? (game.mygoScore / total * 100) : 50;

            setTimeout(() => {
                $('bar-ave').style.width = avePct + '%';
                $('bar-mygo').style.width = mygoPct + '%';
            }, 200);

            // 判定文字（梗圖人格診斷）
            const verdict = getVerdict();
            $('diagnosis-title').innerHTML = verdict.title;
            $('verdict').innerHTML = verdict.desc;

            // 進度條拉滿
            $('progress-fill').style.width = '100%';
        }

        // ── 計數動畫 ──
        function animateCount(elementId, target) {
            const el = $(elementId);
            let current = 0;
            const step = Math.max(1, Math.floor(target / 20));
            const interval = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(interval);
                }
                el.textContent = current;
            }, 50);
        }

        // ── 判定訊息（梗圖人格診斷） ──
        function getVerdict() {
            const total = game.totalRounds;
            const aveScore = game.aveScore;
            const mygoScore = game.mygoScore;
            const winRatio = Math.max(aveScore, mygoScore) / total;

            // 隨機從陣列中挑一個
            function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

            // === 平手 ===
            if (aveScore === mygoScore) {
                return pick([
                    {
                        title: '🎪 雙棲樂子人',
                        desc: '你不是 MyGO 派。<br>也不是 Ave Mujica 派。<br><br>你只是喜歡看大家發病。'
                    },
                    {
                        title: '🍿 純種觀眾',
                        desc: '當角色開始吵架：<br><br>別人很緊張。<br>你很興奮。'
                    }
                ]);
            }

            const winner = aveScore > mygoScore ? 'ave' : 'mygo';

            // === Ave Mujica 壓倒性 (≥90%) ===
            if (winner === 'ave' && winRatio >= 0.9) {
                return pick([
                    {
                        title: '🌙 重力失控',
                        desc: '已經不是重女了。<br><br>是黑洞。'
                    },
                    {
                        title: '🌙 宿命論支持者',
                        desc: '正常人看到誤會會想解開。<br><br>你看到誤會會想：<br>「再增加一點會不會更精彩？」'
                    }
                ]);
            }

            // === Ave Mujica 優勢 (≥60%) ===
            if (winner === 'ave') {
                return pick([
                    {
                        title: '💜 輕度重力患者',
                        desc: '看來比起坐下來好好溝通，<br>你更喜歡先把事情搞複雜。<br><br>等到所有人都受傷之後，<br>再用一首歌解決。'
                    },
                    {
                        title: '💜 劇情發酵派',
                        desc: '你的選擇證明了一件事：<br><br>能一句話說清楚的事情，<br>你比較喜歡繞十二集再講。'
                    }
                ]);
            }

            // === MyGO 壓倒性 (≥90%) ===
            if (winner === 'mygo' && winRatio >= 0.9) {
                return pick([
                    {
                        title: '☀️ 羈絆信仰者',
                        desc: '所有人都在發病。<br><br>而你還相信友情。'
                    }
                ]);
            }

            // === MyGO 優勢 (≥60%) ===
            return pick([
                {
                    title: '💙 青春補完計畫',
                    desc: '你似乎相信<br>只要大家哭得夠久，<br><br>樂團最後都能成立。'
                },
                {
                    title: '💙 希望派代表',
                    desc: '別人看的是樂團動畫。<br><br>你看的其實是大型心理諮商現場。'
                }
            ]);
        }

        // ── 重新開始 ──
        function restart() {
            // 重置分數條
            $('bar-ave').style.width = '50%';
            $('bar-mygo').style.width = '50%';
            $('progress-fill').style.width = '0%';

            showScreen('start-screen');
        }
    </script>
</body>
</html>
